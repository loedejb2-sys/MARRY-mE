<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Proposal Status Tracker 📊</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      font-size: 2.2rem;
      color: #f43f5e;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #64748b;
      margin-bottom: 15px;
      font-weight: 700;
    }
    .answer {
      font-size: 1.8rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 15px;
    }
    .subtext {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 25px;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .reset-btn:hover {
      background: #334155;
      color: #f8fafc;
      border-color: #64748b;
    }
  </style>
</head>
<body>

  <h1>Proposal Status Tracker</h1>
  <p class="subtitle">Live status updates from her click</p>

  <div class="status-card">
    <div class="label">Current Answer</div>
    <div class="answer" id="answerText">AWAITING RESPONSE... ⏳</div>
    <div class="subtext" id="subtext">Waiting for her to click...</div>
    <button class="reset-btn" id="resetBtn" onclick="resetAnswer()">Reset Tracker</button>
  </div>

  <script>
    async function checkResponse() {
      try {
        const res = await fetch('/api/response');
        if (!res.ok) return;

        const data = await res.json();

        const answerEl = document.getElementById('answerText');
        const subtextEl = document.getElementById('subtext');

        if (data && data.answer === 'YES') {
          answerEl.textContent = "SHE SAID YES! 🎉💖";
          answerEl.style.color = "#4ade80";
          subtextEl.textContent = `Received at ${data.timestamp || 'just now'}`;
        } else if (data && data.answer === 'NO') {
          answerEl.textContent = "She said no... 🥺";
          answerEl.style.color = "#f87171";
          subtextEl.textContent = `Received at ${data.timestamp || 'just now'}`;
        } else {
          answerEl.textContent = "AWAITING RESPONSE... ⏳";
          answerEl.style.color = "#38bdf8";
          subtextEl.textContent = "Waiting for her to click...";
        }
      } catch (err) {
        console.error('Polling error:', err);
      }
    }

    async function resetAnswer() {
      const resetBtn = document.getElementById('resetBtn');
      resetBtn.textContent = 'Resetting...';
      resetBtn.disabled = true;

      try {
        const res = await fetch('/api/response', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answer: '', timestamp: '' })
        });

        if (res.ok) {
          document.getElementById('answerText').textContent = "AWAITING RESPONSE... ⏳";
          document.getElementById('answerText').style.color = "#38bdf8";
          document.getElementById('subtext').textContent = "Waiting for her to click...";
        }
      } catch (err) {
        console.error('Error during reset:', err);
      } finally {
        resetBtn.textContent = 'Reset Tracker';
        resetBtn.disabled = false;
      }
    }

    checkResponse();
    setInterval(checkResponse, 2000);
  </script>

</body>
</html>
