<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Proposal & Live Location Tracker ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #172033 50%, #1e1b2e 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(to right, #f6d8ae, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      text-align: center;
    }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
    
    .container {
      display: flex;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }
    .status-card, .map-card {
      background: rgba(23, 32, 51, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(246, 216, 174, 0.15);
      padding: 30px;
      border-radius: 24px;
      flex: 1;
      min-width: 350px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f6d8ae;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .answer {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 10px;
    }
    .subtext { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }

    #map {
      width: 100%;
      height: 250px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 10px;
    }

    .slider-section {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
    }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; }
    input[type=range] { width: 100%; accent-color: #f43f5e; cursor: pointer; }
    .nav-btns { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .nav-btn { background: rgba(51, 65, 85, 0.6); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.1); padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .reset-btn {
      background: transparent;
      border: 1px solid rgba(246, 216, 174, 0.3);
      color: #f6d8ae;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .reset-btn:hover { background: rgba(246, 216, 174, 0.1); border-color: #f6d8ae; }
  </style>
</head>
<body>

  <h1>Will You Marry Me</h1>
  <p class="subtitle">Live Status & Location Command Center</p>

  <div class="container">
    <div class="status-card">
      <div class="label" id="cardLabel">Current Answer</div>
      <div class="answer" id="answerText">AWAITING RESPONSE... ⏳</div>
      <div class="subtext" id="subtext">Watching for her decision...</div>

      <div class="slider-section" id="sliderSection">
        <div class="slider-header">
          <span>Timeline History</span>
          <strong id="clickCounter" style="color: #f6d8ae;">Click 0 / 0</strong>
        </div>
        <input type="range" id="historySlider" min="0" max="0" value="0" oninput="onSliderChange(this.value)">
        <div class="nav-btns">
          <button class="nav-btn" id="prevBtn" onclick="navigateHistory(-1)">← Prev</button>
          <button class="nav-btn" id="nextBtn" onclick="navigateHistory(1)">Next →</button>
        </div>
      </div>

      <button class="reset-btn" onclick="resetAnswer()">Reset Tracker Data</button>
    </div>

    <div class="map-card">
      <div class="label">Live GPS Tracker</div>
      <div class="subtext" id="locStatus" style="margin-bottom: 10px;">Waiting for her location signal...</div>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let historyData = [];
    let currentIndex = -1;
    let userInteractedWithSlider = false;

    // Initialize Map with your Mapbox integration
    const mapboxKey = 'cb1_2ygy_1_1a720b2df549f16719dc96f8';
    let map = L.map('map').setView([52.1326, 5.2913], 13);
    
    // Using standard Mapbox streets/dark tiles via Leaflet
    L.tileLayer('https://api.mapbox.com/styles/v1/mapbox/dark-v11/tiles/{z}/{x}/{y}?access_token=' + mapboxKey, {
      tileSize: 512,
      zoomOffset: -1,
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.mapbox.com/">Mapbox</a>'
    }).addTo(map);

    let marker = null;

    async function checkResponse() {
      try {
        const res = await fetch('/api/response');
        if (!res.ok) return;

        const data = await res.json();
        const history = data.history || [];
        const location = data.location;

        if (location && location.lat && location.lng) {
          const latLng = [location.lat, location.lng];
          if (!marker) {
            marker = L.marker(latLng).addTo(map).bindPopup("Her Live Location 📍").openPopup();
          } else {
            marker.setLatLng(latLng);
          }
          map.setView(latLng, 15);
          document.getElementById('locStatus').textContent = `Last updated at ${location.timestamp}`;
        }

        const hasNewClick = history.length !== historyData.length;
        historyData = history;

        const sliderSec = document.getElementById('sliderSection');
        const slider = document.getElementById('historySlider');

        if (historyData.length === 0) {
          sliderSec.style.display = 'none';
          renderState(null);
          return;
        }

        sliderSec.style.display = 'block';
        slider.max = historyData.length - 1;

        if (!userInteractedWithSlider || hasNewClick) {
          currentIndex = historyData.length - 1;
          slider.value = currentIndex;
          userInteractedWithSlider = false;
        }

        renderCurrentIndex();
      } catch (err) {
        console.error('Polling error:', err);
      }
    }

    function renderCurrentIndex() {
      if (historyData.length === 0 || currentIndex < 0) return;
      const entry = historyData[currentIndex];
      renderState(entry);

      document.getElementById('clickCounter').textContent = `Click ${currentIndex + 1} of ${historyData.length}`;
      document.getElementById('historySlider').value = currentIndex;
      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === historyData.length - 1);

      const isLatest = (currentIndex === historyData.length - 1);
      document.getElementById('cardLabel').textContent = isLatest ? "Latest Answer" : `Historical Response (#${currentIndex + 1})`;
    }

    function renderState(data) {
      const answerEl = document.getElementById('answerText');
      const subtextEl = document.getElementById('subtext');

      if (data && data.answer === 'YES') {
        answerEl.textContent = "SHE SAID YES! 🎉💖";
        answerEl.style.color = "#4ade80";
        subtextEl.textContent = `Recorded at ${data.timestamp || 'just now'}`;
      } else if (data && data.answer === 'NO') {
        answerEl.textContent = "She said no... 🥺";
        answerEl.style.color = "#f87171";
        subtextEl.textContent = `Recorded at ${data.timestamp || 'just now'}`;
      } else {
        answerEl.textContent = "AWAITING RESPONSE... ⏳";
        answerEl.style.color = "#38bdf8";
        subtextEl.textContent = "Watching for her decision...";
      }
    }

    function onSliderChange(val) {
      userInteractedWithSlider = true;
      currentIndex = parseInt(val, 10);
      renderCurrentIndex();
    }

    function navigateHistory(direction) {
      userInteractedWithSlider = true;
      const newIdx = currentIndex + direction;
      if (newIdx >= 0 && newIdx < historyData.length) {
        currentIndex = newIdx;
        renderCurrentIndex();
      }
    }

    async function resetAnswer() {
      try {
        await fetch('/api/response', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset: true })
        });
        historyData = [];
        currentIndex = -1;
        userInteractedWithSlider = false;
        document.getElementById('sliderSection').style.display = 'none';
        document.getElementById('cardLabel').textContent = "Current Answer";
        renderState(null);
        document.getElementById('locStatus').textContent = "Tracker reset.";
      } catch (err) {
        console.error('Reset error:', err);
      }
    }

    checkResponse();
    setInterval(checkResponse, 3000);
  </script>

</body>
</html>
