<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question... ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Fredoka', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(233, 30, 99, 0.2);
      max-width: 400px;
      width: 90%;
    }
    .emoji { font-size: 4rem; margin-bottom: 10px; }
    h1 { color: #d81b60; font-size: 2rem; margin-bottom: 25px; }
    .btn-group { display: flex; gap: 15px; justify-content: center; }
    button {
      padding: 14px 28px;
      font-size: 1.2rem;
      font-family: 'Fredoka', sans-serif;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-yes { background: #e91e63; color: white; box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4); }
    .btn-yes:hover { transform: scale(1.1); }
    .btn-no { background: #e0e0e0; color: #555; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji" id="emoji">💖</div>
    <h1 id="questionText">Will You Marry Me?</h1>
    <div class="btn-group" id="btnGroup">
      <button class="btn-yes" onclick="sendAnswer('YES')">YES! 🥰</button>
      <button class="btn-no" onclick="sendAnswer('NO')">No 🥺</button>
    </div>
  </div>

  <script>
    async function sendAnswer(choice) {
      const emoji = document.getElementById('emoji');
      const question = document.getElementById('questionText');
      const btnGroup = document.getElementById('btnGroup');

      // Send the click to your background server
      try {
        await fetch('http://localhost:3000/api/response', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answer: choice, timestamp: new Date().toLocaleTimeString() })
        });
      } catch (err) {
        console.log("Server error:", err);
      }

      btnGroup.style.display = 'none';

      if (choice === 'YES') {
        emoji.textContent = "🥳💖";
        question.textContent = "YYAYYYY I LOVEEE YOUUUU!";
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
      } else {
        emoji.textContent = "🥺🤍";
        question.textContent = "I understand, love..";
      }
    }
  </script>
</body>
</html>
