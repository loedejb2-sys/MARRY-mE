<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Special Question... 💖</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #ff3366;
      font-size: 2rem;
      margin-bottom: 25px;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }
    button {
      padding: 12px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn-yes {
      background-color: #ff3366;
      color: #ffffff;
    }
    .btn-yes:hover {
      background-color: #e02855;
      transform: scale(1.05);
    }
    .btn-no {
      background-color: #e0e0e0;
      color: #555555;
    }
    .response-message {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ff3366;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1>Will You Marry Me? 💍</h1>
    <div class="btn-container" id="btnGroup">
      <button class="btn-yes" onclick="handleAnswer('YES')">YES! 💖</button>
      <button class="btn-no" id="noBtn" onclick="handleAnswer('NO')">No 🥺</button>
    </div>
  </div>

  <script>
    function handleAnswer(answer) {
      // Trigger confetti on YES
      if (answer === 'YES') {
        confetti({
          particleCount: 120,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      // Update UI immediately
      const card = document.getElementById('card');
      card.innerHTML = answer === 'YES' 
        ? `<div class="response-message">YYAYYYY I LOVEEE YOUUUU! 🎉💖</div>`
        : `<div class="response-message">Oh no... 💔</div>`;

      // Send response to API using relative path
      fetch('/api/response', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          answer: answer,
          timestamp: new Date().toLocaleString()
        })
      })
      .then(res => res.json())
      .then(data => console.log('Saved to server:', data))
      .catch(err => console.error('Error saving answer:', err));
    }
  </script>

</body>
</html>
