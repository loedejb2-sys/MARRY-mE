<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Marry Me?</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      font-family: 'Georgia', serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        #1a237e 0%,
        #283593 15%,
        #3f51b5 25%,
        #8e24aa 40%,
        #d81b60 55%,
        #f57c00 70%,
        #ffb300 80%,
        #ff8f00 100%
      );
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Ocean & Horizon */
    .ocean {
      position: absolute;
      bottom: 30%;
      width: 100%;
      height: 15%;
      background: linear-gradient(to bottom, #2c385e 0%, #1c233a 100%);
      opacity: 0.85;
    }

    .sun-glow {
      position: absolute;
      bottom: 38%;
      width: 400px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 235, 59, 0.9) 0%, rgba(255, 152, 0, 0.6) 40%, transparent 70%);
      filter: blur(20px);
    }

    /* Beach Sand */
    .sand {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35%;
      background: linear-gradient(to bottom, #3d2b24 0%, #211510 100%);
    }

    .sand-texture {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35%;
      background: radial-gradient(circle at 50% 0%, rgba(255, 179, 0, 0.15), transparent 70%);
    }

    /* Birds */
    .birds {
      position: absolute;
      top: 25%;
      left: 15%;
      font-size: 14px;
      color: rgba(20, 20, 20, 0.6);
      letter-spacing: 18px;
      transform: rotate(-5deg);
    }

    /* Heart Arch Container */
    .arch-container {
      position: relative;
      z-index: 2;
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    /* Neon Text */
    .neon-text {
      position: absolute;
      z-index: 3;
      text-align: center;
      font-family: 'Brush Script MT', 'Dancing Script', cursive, sans-serif;
      color: #fff;
      font-size: 3.8rem;
      line-height: 1.1;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #ffea00,
        0 0 30px #ffea00,
        0 0 40px #ffea00,
        0 0 55px #ff9100,
        0 0 75px #ff9100;
      transform: translateY(-10px);
    }

    /* Interactive Buttons Area */
    .btn-container {
      position: absolute;
      bottom: 12%;
      z-index: 10;
      display: flex;
      gap: 25px;
    }

    .btn {
      padding: 14px 38px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .btn-yes {
      background: linear-gradient(135deg, #ffea00, #ff9100);
      color: #211510;
    }

    .btn-yes:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #ffea00;
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .btn-no:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    /* Candles */
    .candles-container {
      position: absolute;
      bottom: 3%;
      z-index: 4;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .candle {
      width: 14px;
      background: linear-gradient(to right, #e0e0e0, #ffffff, #bdbdbd);
      border-radius: 2px 2px 0 0;
      position: relative;
    }

    .flame {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 12px;
      background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffeb3b 50%, #ff5722 100%);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 12px #ff9100, 0 0 20px #ffea00;
      animation: flicker 0.1s infinite alternate;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
      100% { transform: translateX(-50%) scale(1.08); opacity: 1; }
    }

    /* Popup Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(20px);
      transition: transform 0.4s ease;
      max-width: 90%;
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 2.2rem;
      color: #d81b60;
      margin-bottom: 15px;
      font-family: 'Brush Script MT', 'Dancing Script', cursive, sans-serif;
    }

    .modal-btn {
      margin-top: 20px;
      padding: 10px 25px;
      border: none;
      background: #3f51b5;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="sun-glow"></div>
    <div class="ocean"></div>
    <div class="sand"></div>
    <div class="sand-texture"></div>

    <div class="birds">v &nbsp; v &nbsp; &nbsp; v &nbsp; v</div>

    <div class="arch-container">
      <svg class="heart-svg" viewBox="0 0 100 100">
        <path d="M 50,30 A 20,20 0 0,0 10,30 C 10,60 50,85 50,85 C 50,85 90,60 90,30 A 20,20 0 0,0 50,30 Z" 
              fill="none" stroke="#f5f5f5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 50,30 A 20,20 0 0,0 10,30 C 10,60 50,85 50,85 C 50,85 90,60 90,30 A 20,20 0 0,0 50,30 Z" 
              fill="none" stroke="#e0e0e0" stroke-width="8" stroke-dasharray="2 3"/>
      </svg>

      <div class="neon-text">
        Will You<br>Marry Me?
      </div>
    </div>

    <div class="btn-container">
      <button class="btn btn-yes" onclick="handleResponse(true)">YES!</button>
      <button class="btn btn-no" onclick="handleResponse(false)">No</button>
    </div>

    <div class="candles-container">
      <div class="candle" style="height: 30px;"><div class="flame"></div></div>
      <div class="candle" style="height: 45px;"><div class="flame"></div></div>
      <div class="candle" style="height: 25px;"><div class="flame"></div></div>
      <div class="candle" style="height: 50px;"><div class="flame"></div></div>
      <div class="candle" style="height: 35px;"><div class="flame"></div></div>
      <div class="candle" style="height: 20px;"><div class="flame"></div></div>
      <div class="candle" style="height: 40px;"><div class="flame"></div></div>
    </div>
  </div>

  <div class="modal-overlay" id="responseModal">
    <div class="modal-box">
      <div class="modal-title" id="modalText"></div>
      <button class="modal-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    function handleResponse(isYes) {
      const modal = document.getElementById('responseModal');
      const text = document.getElementById('modalText');

      if (isYes) {
        text.innerHTML = "YYAYYYY I LOVEEE YOUUUU! ❤️✨";
        
        // Continuous confetti burst
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
          confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: ['#ffea00', '#ff9100', '#d81b60', '#ffffff']
          });
          confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: ['#ffea00', '#ff9100', '#d81b60', '#ffffff']
          });

          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        }());
      } else {
        text.innerHTML = "i understand love.. 🥺";
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('responseModal').classList.remove('active');
    }
  </script>
</body>
</html>
