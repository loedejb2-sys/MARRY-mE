<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Marry Me?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      font-family: 'Georgia', serif;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        #1a237e 0%,
        #283593 15%,
        #3f51b5 25%,
        #8e24aa 40%,
        #d81b60 55%,
        #f57c00 70%,
        #ffb300 80%,
        #ff8f00 100%
      );
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ocean & Horizon */
    .ocean {
      position: absolute;
      bottom: 30%;
      width: 100%;
      height: 15%;
      background: linear-gradient(to bottom, #2c385e 0%, #1c233a 100%);
      opacity: 0.85;
    }

    .sun-glow {
      position: absolute;
      bottom: 38%;
      width: 400px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 235, 59, 0.9) 0%, rgba(255, 152, 0, 0.6) 40%, transparent 70%);
      filter: blur(20px);
    }

    /* Beach Sand */
    .sand {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35%;
      background: linear-gradient(to bottom, #3d2b24 0%, #211510 100%);
    }

    .sand-texture {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 35%;
      background: radial-gradient(circle at 50% 0%, rgba(255, 179, 0, 0.15), transparent 70%);
    }

    /* Floating Birds */
    .birds {
      position: absolute;
      top: 35%;
      left: 20%;
      font-size: 12px;
      color: rgba(20, 20, 20, 0.6);
      letter-spacing: 15px;
      transform: rotate(-5deg);
    }

    /* Heart Floral Arch Frame */
    .arch-container {
      position: relative;
      z-index: 2;
      width: 600px;
      height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* SVG Heart Outline with Flowers */
    .heart-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
    }

    /* Neon Sign Styling */
    .neon-text {
      position: absolute;
      z-index: 3;
      text-align: center;
      font-family: 'Brush Script MT', 'Dancing Script', cursive, sans-serif;
      color: #fff;
      font-size: 4.2rem;
      line-height: 1.1;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px #ffea00,
        0 0 30px #ffea00,
        0 0 40px #ffea00,
        0 0 55px #ff9100,
        0 0 75px #ff9100;
      transform: translateY(-10px);
    }

    /* Candles */
    .candles-container {
      position: absolute;
      bottom: 8%;
      z-index: 4;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .candle {
      width: 16px;
      background: linear-gradient(to right, #e0e0e0, #ffffff, #bdbdbd);
      border-radius: 2px 2px 0 0;
      position: relative;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .flame {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 12px;
      background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffeb3b 50%, #ff5722 100%);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 12px #ff9100, 0 0 20px #ffea00;
      animation: flicker 0.1s infinite alternate;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); opacity: 0.9; }
      100% { transform: translateX(-50%) scale(1.08); opacity: 1; }
    }

    /* Foreground Strewed Roses */
    .roses-ground {
      position: absolute;
      bottom: 4%;
      z-index: 3;
      width: 650px;
      display: flex;
      justify-content: space-between;
    }

    .rose-cluster {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #fff 40%, #e0e0e0 70%, transparent 71%);
      border-radius: 50%;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="sun-glow"></div>
    <div class="ocean"></div>
    <div class="sand"></div>
    <div class="sand-texture"></div>

    <div class="birds">v &nbsp; v &nbsp; &nbsp; v &nbsp; v</div>

    <div class="arch-container">
      
      <svg class="heart-svg" viewBox="0 0 100 100">
        <path id="heart-path" d="M 50,30 A 20,20 0 0,0 10,30 C 10,60 50,85 50,85 C 50,85 90,60 90,30 A 20,20 0 0,0 50,30 Z" 
              fill="none" stroke="#f5f5f5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 50,30 A 20,20 0 0,0 10,30 C 10,60 50,85 50,85 C 50,85 90,60 90,30 A 20,20 0 0,0 50,30 Z" 
              fill="none" stroke="#e0e0e0" stroke-width="8" stroke-dasharray="2 3"/>
      </svg>

      <div class="neon-text">
        Will You<br>Marry Me?
      </div>
    </div>

    <div class="roses-ground">
      <div class="rose-cluster"></div>
      <div class="rose-cluster"></div>
      <div class="rose-cluster"></div>
      <div class="rose-cluster"></div>
    </div>

    <div class="candles-container">
      <div class="candle" style="height: 30px;"><div class="flame"></div></div>
      <div class="candle" style="height: 45px;"><div class="flame"></div></div>
      <div class="candle" style="height: 25px;"><div class="flame"></div></div>
      <div class="candle" style="height: 50px;"><div class="flame"></div></div>
      <div class="candle" style="height: 35px;"><div class="flame"></div></div>
      <div class="candle" style="height: 20px;"><div class="flame"></div></div>
      <div class="candle" style="height: 40px;"><div class="flame"></div></div>
    </div>
  </div>

</body>
</html>
