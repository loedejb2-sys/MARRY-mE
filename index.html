<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question... ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #ff7e5f 0%, #feb47b 40%, #ff6a88 75%, #d81b60 100%);
      text-align: center;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      padding: 40px 30px;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      max-width: 420px;
      width: 90%;
      border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .emoji {
      font-size: 4.5rem;
      margin-bottom: 15px;
      transition: transform 0.3s ease;
    }

    h1 {
      color: #d81b60;
      font-size: 2.1rem;
      margin-bottom: 25px;
      line-height: 1.3;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }

    button {
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-yes {
      background: #e91e63;
      color: white;
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      background: #d81b60;
    }

    .btn-no {
      background: #eceff1;
      color: #546e7a;
    }

    .btn-no:hover {
      background: #cfd8dc;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji" id="emoji">🌅</div>
    <h1 id="questionText">Will You Marry Me?</h1>
    <div class="btn-group" id="btnGroup">
      <button class="btn-yes" onclick="sendAnswer('YES')">YES! 🥰</button>
      <button class="btn-no" onclick="sendAnswer('NO')">No 🥺</button>
    </div>
  </div>

  <script>
    async function sendAnswer(choice) {
      const emoji = document.getElementById('emoji');
      const question = document.getElementById('questionText');
      const btnGroup = document.getElementById('btnGroup');

      // 1. Send response to Vercel API & Upstash Redis
      try {
        await fetch('/api/response', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            answer: choice, 
            timestamp: new Date().toLocaleTimeString() 
          })
        });
      } catch (err) {
        console.error("Error sending response:", err);
      }

      // 2. Hide buttons & update page UI
      btnGroup.style.display = 'none';

      if (choice === 'YES') {
        emoji.textContent = "🥳💖";
        question.textContent = "YYAYYYY I LOVEEE YOUUUU!";
        
        // Celebratory Confetti Burst
        confetti({ 
          particleCount: 180, 
          spread: 90, 
          origin: { y: 0.6 } 
        });
      } else {
        emoji.textContent = "🥺🤍";
        question.textContent = "I understand, love..";
      }
    }
  </script>

</body>
</html>
